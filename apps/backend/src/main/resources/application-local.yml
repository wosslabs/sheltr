spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:3b-instruct
      embedding:
        model: nomic-embed-text:v1.5
  # Request timeouts: Spring AI 2.0 exposes no Ollama request timeout property.
  # spring.ai.ollama.init.timeout (5m) only bounds the startup model pull and is off by default
  # (pull-model-strategy: never), so it is not set. The read timeout for this Ollama block is the
  # shared Boot value in application.yml (spring.http.clients.read-timeout: 120s, connect 5s).
  # No executor wrapper is added.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration

sheltr:
  search:
    # Used by the threshold judge. The eval has not yet chosen the default judge or threshold;
    # see docs/adr/0012-hybrid-retrieval-and-relevance-judge.md. Calibrated against the pinned
    # nomic-embed-text:v1.5 tag (see infra/podman/compose.yaml and Makefile): re-check before
    # changing that tag.
    relevance-threshold: 0.65
  embedding:
    # Recorded on every chunk. Change this name whenever the model tag or a prefix changes,
    # then run `make seed-embeddings`; otherwise old vectors are silently reused.
    model-name: nomic-embed-text:v1.5
