spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration

sheltr:
  search:
    # Pre-existing Phase-2 value, unchanged by ADR-0011's migration. NOT derived by
    # RelevanceThresholdEvalTest — that harness is hard-pinned to @ActiveProfiles("local")
    # and has never been run against Gemini's embedding space. See ADR-0011.
    relevance-threshold: 0.75
  embedding:
    model-name: gemini-embedding-001
