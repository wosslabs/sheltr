spring:
  application:
    name: sheltr-backend
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sheltr
    username: sheltr
    password: sheltr
  flyway:
    enabled: true

server:
  port: 8080

lumina:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

sheltr:
  security:
    admin:
      # Admin routes (/api/v1/admin/**) use HTTP Basic with role ADMIN.
      username: admin
      # Set SHELTR_ADMIN_PASSWORD (plain or {noop}) or SHELTR_ADMIN_PASSWORD_HASH (bcrypt), never both.
      # Outside the local profile, startup fails when neither is set.
      password: ${SHELTR_ADMIN_PASSWORD:}
      password-hash: ${SHELTR_ADMIN_PASSWORD_HASH:}
  limits:
    # Per-client-IP requests per minute on POST /api/v1/conversations/*/ask. Exceeding returns 429.
    ask-per-minute: 10
    # Daily cap on user questions (UTC day), checked before the LLM call. Exceeding returns 429.
    max-asks-per-day: 1000
  ingestion:
    # Hostnames the ingestion connector may fetch. Empty denies all. Checked before any network call.
    allowed-hosts: [www.ready.gov]
  search:
    # Document statuses retrieval may return. SEED rows are test fixtures and are never listed here.
    statuses: ACTIVE
    # vector | hybrid. Switched to hybrid only if the eval shows a gain (Task 14).
    mode: vector
    candidates-per-list: 20
    hazard-boost: 0.3
    related-hazard-boost: 0.15
    # none | model. Switched to model only if the eval shows a gain (Task 14).
    reranker: none
  judge:
    # threshold | model. threshold uses sheltr.search.relevance-threshold from the active profile.
    type: threshold
    min-probability: 0.5
  confidence:
    # Refitted on the eval tuning split for the chosen judge (Task 14).
    high: 0.90
    medium: 0.75
