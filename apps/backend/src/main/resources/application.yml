spring:
  application:
    name: sheltr-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sheltr
    username: sheltr
    password: sheltr
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sheltr:
  search:
    relevance-threshold: 0.75
