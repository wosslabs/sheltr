spring:
  application:
    name: sheltr-backend
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sheltr
    username: sheltr
    # The database password default is the local Postgres container credential only; it is not the admin credential (spec §2.1 carve-out).
    password: ${SHELTR_DB_PASSWORD:sheltr}
  flyway:
    enabled: true
  http:
    clients:
      # Boot's shared RestClient timeouts. They apply to EVERY Boot-built RestClient, including the
      # Ollama client (Spring AI 2.0 exposes no Ollama request timeout, so this is the bound that
      # applies). Gemini uses its own Google GenAI SDK and does NOT read these values: residual risk.
      # Key names are the canonical Boot 4.1 ones (spring.http.clients.*); spring.http.client.* is deprecated.
      connect-timeout: 5s
      read-timeout: 120s

server:
  port: 8080

lumina:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

sheltr:
  security:
    admin:
      # Admin routes (/api/v1/admin/**) use HTTP Basic with role ADMIN.
      username: admin
      # Set SHELTR_ADMIN_PASSWORD (plain value) or SHELTR_ADMIN_PASSWORD_HASH (bcrypt), never both.
      # In every profile, including local, startup fails when neither is set. No password lives in YAML.
      password: ${SHELTR_ADMIN_PASSWORD:}
      password-hash: ${SHELTR_ADMIN_PASSWORD_HASH:}
  limits:
    # Per-client-IP requests per minute on POST /api/v1/conversations/*/ask. Exceeding returns 429.
    ask-per-minute: 10
    # Daily cap on user questions (UTC day), checked before the LLM call. Exceeding returns 429.
    max-asks-per-day: 1000
  ingestion:
    # Hostnames the ingestion connector may fetch. Empty denies all. Checked before any network call.
    allowed-hosts: [www.ready.gov]
    # Source fetch timeouts (spec 2.4). Positive durations; redirects are always refused.
    # connect-timeout: TCP/TLS connect. request-timeout: bounds the wait for response headers, not a slow body.
    connect-timeout: 10s
    request-timeout: 60s
  search:
    # Document statuses retrieval may return. SEED rows are test fixtures and are never listed here.
    statuses: ACTIVE
    # vector | hybrid. Switched to hybrid only if the eval shows a gain (Task 14).
    mode: vector
    candidates-per-list: 20
    hazard-boost: 0.3
    related-hazard-boost: 0.15
    # Multiplicative boost for guidance of the asker's country (ISO code on the question).
    # Reorders only; global and other-country passages are never removed.
    country-boost: 0.15
    # none | model. Switched to model only if the eval shows a gain (Task 14).
    reranker: none
  judge:
    # threshold | model. threshold uses sheltr.search.relevance-threshold from the active profile.
    type: threshold
    min-probability: 0.5
  confidence:
    # Refitted on the eval tuning split for the chosen judge (Task 14).
    high: 0.90
    medium: 0.75
