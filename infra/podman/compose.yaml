services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sheltr-postgres
    environment:
      POSTGRES_DB: sheltr
      POSTGRES_USER: sheltr
      POSTGRES_PASSWORD: sheltr
    ports:
      - "5432:5432"
    volumes:
      - sheltr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheltr -d sheltr"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: docker.io/ollama/ollama:0.32.6
    container_name: sheltr-ollama
    ports:
      - "11434:11434"
    volumes:
      - sheltr-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sheltr-postgres-data:
  sheltr-ollama-data:
