# Required by the Android Gradle plugin: SQLDelight's android-driver pulls in AndroidX artifacts
# (androidx.sqlite, androidx.startup), which need AndroidX itself enabled. This is android.useAndroidX,
# not android.enableJetifier (Jetifier's own setting, for migrating off the legacy support library).
android.useAndroidX=true

# Kotlin/Native (iOS) linking and the Android/Compose build exceed Gradle's defaults.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
