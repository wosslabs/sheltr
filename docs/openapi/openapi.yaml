openapi: 3.0.3
info:
  title: Sheltr Disaster Response Knowledge Assistant API
  version: "1.0"
  description: >
    Core RAG endpoints. Admin endpoints under /admin/ require HTTP Basic
    authentication with the ADMIN role (see docs/adr/0014). Every error
    response uses the ApiError body. Some operations are rate limited;
    see the 429 responses.
servers:
  - url: /api/v1
paths:
  /conversations:
    post:
      summary: Start a new conversation
      operationId: startConversation
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}:
    get:
      summary: Get conversation history
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation with message history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Conversation not found
  /conversations/{id}/ask:
    post:
      summary: Ask a question in this conversation (non-streaming)
      operationId: askQuestion
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Generated, citation-grounded answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: >
            Validation failed: question blank or longer than 2000 characters,
            or activeHazards over 12 entries or containing an unknown hazard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >
            Rate or cap exceeded. LIMIT_EXCEEDED is returned for the per-client
            per-minute limit (sheltr.limits.ask-per-minute, with Retry-After) and
            for the daily question cap (sheltr.limits.max-asks-per-day).
          headers:
            Retry-After:
              description: Seconds until the per-minute window reopens. Sent for the per-minute limit.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{id}/ask/stream:
    post:
      summary: Ask a question in this conversation (streaming, SSE)
      operationId: askQuestionStream
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Server-sent event stream of answer tokens, terminated by a final Message event
          content:
            text/event-stream:
              schema:
                type: string
  /documents/{id}:
    get:
      summary: Get document metadata
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMetadata"
        "404":
          description: Document not found
  /documents/{id}/citations:
    get:
      summary: Get chunks/pages cited from this document
      operationId: getDocumentCitations
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Citations referencing this document
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Citation"
  /admin/ingestion/runs:
    post:
      summary: Trigger ingestion for a source
      operationId: triggerIngestionRun
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerIngestionRequest"
      responses:
        "202":
          description: Ingestion run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRun"
        "400":
          description: >
            Validation failed, including a sourceUri whose host is not in
            sheltr.ingestion.allowed-hosts (rejected before any network call)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user does not have the ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/ingestion/runs/{id}:
    get:
      summary: Get ingestion run status
      operationId: getIngestionRun
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ingestion run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRun"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user does not have the ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Ingestion run not found
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Admin role only. Username admin; password from SHELTR_ADMIN_PASSWORD.
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ApiError:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
          description: Stable machine-readable code, such as VALIDATION_FAILED, LIMIT_EXCEEDED, UNAUTHORIZED or FORBIDDEN
        message:
          type: string
          description: Client-safe description
        timestamp:
          type: string
          format: date-time
    AskRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        disasterTypes:
          type: array
          items:
            type: string
            enum: [EARTHQUAKE, FLOOD, HURRICANE, TORNADO, TSUNAMI, WILDFIRE, EXTREME_HEAT, WINTER_STORM]
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
        confidenceScore:
          type: number
          nullable: true
        confidenceLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          nullable: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
    Citation:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        chunkId:
          type: string
          format: uuid
        sourceTitle:
          type: string
        sourceUrl:
          type: string
        pageNumber:
          type: integer
          nullable: true
    DocumentMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sourceAgency:
          type: string
        sourceUri:
          type: string
        disasterTypes:
          type: array
          items:
            type: string
        publishedDate:
          type: string
          format: date
        version:
          type: integer
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED, RETRACTED]
    TriggerIngestionRequest:
      type: object
      required: [sourceUri, sourceType]
      properties:
        sourceUri:
          type: string
        sourceType:
          type: string
          enum: [PDF, HTML, MARKDOWN, TEXT, RSS_ITEM]
    IngestionRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceDocumentId:
          type: string
          format: uuid
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
