name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publisher:
    name: publisher (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/publisher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/publisher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: mobile (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx expo-doctor
      - run: npm run typecheck
      - run: npm test
      # Metro must be able to bundle both platforms (Hermes bytecode is produced), which catches broken imports
      # and unresolvable packages that unit tests do not reach.
      - run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/export"
        env:
          CI: '1'
