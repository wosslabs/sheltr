# documents:
#   - source_uri: direct URL of the PDF, or of the HTML page when source_type is html
#     source_type: pdf (default) or html. An html entry's text is the main content extracted by the
#       HTML connector; its checksum is the SHA-256 of that extracted UTF-8 text, not of the raw page.
#     title: title as printed on the document
#     source_agency: publishing organisation
#     hazards: [FLOOD, LANDSLIDE]
#     country: ISO 3166-1 alpha-2 code, or GLOBAL
#     published_date: 2021-03-15
#     reviewed_on: 2026-10-05
#     expires_on: 2027-11-02
#     reviewed_by: a role, not a person's name
#     license: reuse terms, plus the URL where they are stated
#     checksum: SHA-256 of the file when it was approved
#
# related_hazards:
#   - hazard: EARTHQUAKE
#     related_hazard: LANDSLIDE
#     source_uri: a document above that states the relationship
#     note: where in the document it is stated
#
# corpus/sample-bundle was rebuilt from this file on 2026-11-03. The signing key for that
